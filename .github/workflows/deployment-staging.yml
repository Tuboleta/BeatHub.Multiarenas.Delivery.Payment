name: Deploy staging 

on:
  push:
    branches: [staging]

permissions:
  id-token: write
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment: staging
    env:
      APP: ${{ vars.APP }}
      ACR: ${{ vars.ACR }}
      NS: ${{ vars.K8S_NAMESPACE || 'default' }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build & push
        run: |
          set -euo pipefail
          IMG="$ACR.azurecr.io/$APP:stg-${{ github.sha }}"
          az acr login -n "$ACR"
          docker build -t "$IMG" .
          docker push "$IMG"
          echo "IMG=$IMG" >> "$GITHUB_ENV"

      - name: Deploy to AKS
        run: |
          set -euo pipefail
          az aks get-credentials \
            -g ${{ vars.AZURE_RESOURCE_GROUP }} \
            -n ${{ vars.AZURE_AKS_CLUSTER }} \
            --overwrite-existing

          ACR_TOKEN=$(az acr login --name "$ACR" --expose-token --output tsv --query accessToken)
          kubectl create secret docker-registry acr-pull-secret \
            --docker-server="$ACR.azurecr.io" \
            --docker-username=00000000-0000-0000-0000-000000000000 \
            --docker-password="$ACR_TOKEN" \
            -n "$NS" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl apply -f manifests/staging/deployment.yml -n "$NS"
          kubectl apply -f manifests/staging/service.yml -n "$NS"          

          kubectl set image deployment/"$APP" "$APP=$IMG" -n "$NS"
          kubectl rollout status deployment/"$APP" -n "$NS" --timeout=5m