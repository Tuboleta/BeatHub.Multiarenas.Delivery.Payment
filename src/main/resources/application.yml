server:
  max-http-request-header-size: 64KB
  port: ${SERVER_PORT:8083}
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:/api/v1/payment}

spring:
  application:
    name: beathub-delivery-payment

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/beathub_db?currentSchema=payment,public}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: payment
        jdbc:
          batch_size: 25
    open-in-view: false

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    create-schemas: true
    schemas: payment
    default-schema: payment
    baseline-on-migrate: false
    locations: classpath:db/migration

# Configuración JWT
security:
  jwt:
    secret-key: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 Horas
    issuer: "beathub-auth-service"

# Configuración Credibanco
credibanco:
  base-url: ${CREDIBANCO_BASE_URL:https://ecouat.credibanco.com/payment/rest}
  username: ${CREDIBANCO_USERNAME:TEST_USER}
  password: ${CREDIBANCO_PASSWORD:TEST_PASSWORD}
  secret-key-hmac: ${CREDIBANCO_SECRET_KEY_HMAC:TEST_CALLBACK_KEY}
  currency-code: ${CREDIBANCO_CURRENCY_CODE:170}
  default-return-url: ${CREDIBANCO_DEFAULT_RETURN_URL:}
  default-fail-url: ${CREDIBANCO_DEFAULT_FAIL_URL:}
  mcc-travel-agency: ${CREDIBANCO_MCC_TRAVEL_AGENCY:false}
  proxy-base-url: ${CREDIBANCO_PROXY_BASE_URL:https://ecouat.credibanco.com/proxy/rest}

# Springdoc OpenAPI 3 / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true

# Spring Boot Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

# CORS Config
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: false
  max-age: 3600

# Clientes Externos / Microservicios
services:
  ordering:
    url: ${SERVICES_ORDERING_URL:http://localhost:8082/api/v1/ordering}
  auth:
    url: ${SERVICES_AUTH_URL:http://localhost:8080/api/v1/auth}
